# The site is only indexable on its real domain: any other address (staging URL) gets noindex.
# Replace example.com with the client's domain.
map $host $robots_tag {
  default "noindex";
  "www.example.com" "";
  "example.com" "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # An add_header in a location block replaces the server-level ones: include the same file everywhere.
  include /etc/nginx/security.inc;

  # Example: permanent redirects from the old CMS URLs to sections of the home page.
  # location = /about/ { return 301 /#about; }
  # location = /about { return 301 /#about; }

  # Pages and unhashed files: the browser revalidates on every visit (304 if unchanged).
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security.inc;
  }

  # Files whose name contains a content hash (see fingerprint.sh): never modified, cached for a year.
  location ~ "\.[0-9a-f]{10}\.(css|js|webp|png|svg|woff2)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security.inc;
  }
}
